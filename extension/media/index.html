<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{stylesUri}}" rel="stylesheet" />
    <title>VMECdash Preview</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="{{brandUri}}" alt="" width="22" height="22" />
          </span>
          <span class="brand-text">
            <span class="brand-name">VMECdash</span>
            <span class="brand-sub">Equilibrium Viewer</span>
          </span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
          <button class="btn-primary" id="exportReport">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v7.7"/><path d="M5 6.6 8 9.7l3-3.1"/><path d="M2.6 12.6h10.8"/></svg></span>
            <span>Export Report</span>
          </button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <span class="topbar-left">
            <button id="navToggle" class="icon-btn" title="Toggle navigation" aria-label="Toggle navigation" aria-expanded="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
            </button>
            <h1 id="viewTitle" class="view-title">VMECdash</h1>
          </span>
          <span class="topbar-right">
            <span id="status" class="status-pill"></span>
            <button id="controlsToggle" class="icon-btn controls-toggle" title="Toggle controls" aria-label="Toggle controls" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 4.5h8M12.5 4.5H14"/><circle cx="10.5" cy="4.5" r="1.6"/><path d="M2 11.5h1.5M6 11.5h8"/><circle cx="4.2" cy="11.5" r="1.6"/></svg>
            </button>
          </span>
        </header>
        <div id="stats" class="stats"></div>
        <div class="plot-wrap">
          <div id="plot" class="plot"></div>
          <div id="loading" class="loading hidden">
            <span class="spinner" aria-hidden="true"></span>
            <span>Rendering…</span>
          </div>
        </div>
      </main>
      <aside class="controls">
        <div class="controls-head">Controls</div>
        <div id="controlBody" class="control-body"></div>
      </aside>
    </div>
    <script nonce="{{nonce}}" src="{{plotlyUri}}"></script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
